	function loadTableData(items) {
		console.log(items);
		var arrayObject;
		const table = document.getElementById("tableBody");
		
		for(var i in items)
		{
			var item = items[i];

			let row = table.insertRow();
			let term = row.insertCell(0);
			term.innerHTML = item.term;
			let amortization = row.insertCell(1);
			amortization.innerHTML = item.amortization;
			let interest = row.insertCell(2);
			interest.innerHTML = item.interest;
			let status = row.insertCell(3);
			status.innerHTML = readTermStatus(item.status);
		}
	}

	function readTermStatus(status)
	{
		var ret = "Pending";
		
		(status == term_status.fully_paid) ? ret = "Fully Paid" : (status == term_status.parially_paid) ? ret = "Parially Paid" : ret = "Pending";
		return ret;
	}
	
	function getLoanTermviaFirebaseAPI(){
		// Create a request variable and assign a new XMLHttpRequest object to it.
		var request = new XMLHttpRequest()

		// Open a new connection, using the GET request on the URL endpoint
		request.open('GET', 'https://payment-f9c12-default-rtdb.firebaseio.com/term_list.json?auth=vAU2WgoNg1lMZDcIYMfzMjIWlZ723pYpWxVvj9Hb&orderBy="loan_id"&equalTo=2', true)

		request.onload = function() {
		 // Begin accessing JSON data here
		  var data = JSON.parse(this.response)

		  if (request.status >= 200 && request.status < 400) {
			console.log("getLoanTerm data");
			console.log(data);
			loadTableData(data);
			initialiseDataTable();
		  } else {
			console.log('error')
		  }
		}

		// Send request
		request.send()
	}
	function getTermStatusiaFirebaseAPI(){
		// Create a request variable and assign a new XMLHttpRequest object to it.
		var request = new XMLHttpRequest()

		// Open a new connection, using the GET request on the URL endpoint
		request.open('GET', 'https://payment-f9c12-default-rtdb.firebaseio.com/term_status.json?auth=vAU2WgoNg1lMZDcIYMfzMjIWlZ723pYpWxVvj9Hb', true)

		request.onload = function() {
		 // Begin accessing JSON data here
		  var data = JSON.parse(this.response)

		  if (request.status >= 200 && request.status < 400) {
			console.log("getTermStatusiaFirebaseAPI data");
			console.log(data);
			term_status = data;
		  } else {
			console.log('error')
		  }
		}

		// Send request
		request.send()
	}
