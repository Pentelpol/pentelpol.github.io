							</div>

									<label for="amount">Amount</label>
									<input type="text" class="form-control" name="amount" id="amount" placeholder="100000" required>
								</div>
								<div class="col">
									<label for="term">Term</label>
									<input type="text" class="form-control" name="term" id="term" placeholder="6" required>
								</div>
								<div class="col">
									<label for="montly_payment">Monthly</label>
									<input type="text" class="form-control" name="montly_payment" id="montly_payment" placeholder="10000" required>

									<label for="reference_number">Reference Number</label>

							</div>
							<div class="form-row">
								<div class="col">
									<label for="name">Remarks</label>
									<input type="text" class="form-control" name="remarks" id="remarksId">
								</div>
