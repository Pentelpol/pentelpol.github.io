    @* Add New Loan *@ -->
	
    <div class="modal fade" id="AddNewLoan" tabindex="-1" role="dialog" aria-labelledby="largeModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-xl" role="document">
            <div class="modal-content">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="AddLoanModalLabel"><i class="fa fa-edit"></i>Add New Loan</h5>
                        <button type="button" class="close" data-bs-dismiss="modal" aria-label="Close">
                            <span aria-hidden="true">&times;</span>
                        </button>
                    </div>
                    <div class="modal-body">
						<form name="myForm" id="myForm" method="post">
							<div class="form-row">
								<div class="col">
									<label for="name">Name</label>
									<input type="text" class="form-control" name="name" id="name" placeholder="iPhone17ProMax" required>
								</div>
								<div class="col">
									<label for="reference_number">Reference Number</label>
									<input type="text" class="form-control" name="reference_number" id="reference_number" placeholder="123456789" required>
								</div>
							</div>
							<div class="form-row">
								<div class="col">
									<label for="amount">Amount</label>
									<input type="text" class="form-control" name="amount" id="amount" placeholder="100000" required>
								</div>
								<div class="col">
									<label for="term">Term</label>
									<input type="text" class="form-control" name="term" id="term" placeholder="6" required>
								</div>
								<div class="col">
									<label for="montly_payment">Monthly</label>
									<input type="text" class="form-control" name="montly_payment" id="montly_payment" placeholder="10000" required>
								</div>
							</div>
							<div hidden>
								<input type="date" class="form-control" name="start_date" id="start_date_id" value="">
								<input type="date" class="form-control" name="end_date" id="end_date_id" value="">
								<input type="text" class="form-control" name="total_payment" id="total_payment_id" value="0">
								<input type="text" class="form-control" name="loan_id" id="loan_id_id" value="">
								<input type="text" class="form-control" name="loan_status" id="loan_status_id" value="1">
							</div>
							<br />
							<div class="modal-footer">
								<button type="submit" id="modalBtnSubmit" class="btn btn-primary">Save</button>
								<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
							</div>
						</form>
                    </div>
                </div>
            </div>
        </div>
